site_name: Feather Fencer Fechtbuch
site_description: A personal knowledge base for historical European martial arts.
site_url: https://unicorn-hema.github.io/feather-fencer-fechtbuch/
repo_url: https://github.com/unicorn-hema/feather-fencer-fechtbuch
repo_name: unicorn-hema/feather-fencer-fechtbuch
edit_uri: edit/main/docs/
theme:
  name: material
  language: en
  features:
    - navigation.top
    - search.suggest
    - search.highlight
plugins:
  - search:
      lang: [en, cs]
nav:
  - Home: index.md
  - About: about.md
  - Editorial framework: editorial/chapter-framework.md
  - Chapters:
      - Preface — Zettel 1–8: chapters/preface.md
      - Zufechten — Zettel 9–16: chapters/zufechten.md
      - The Five Words — Zettel 17–20: chapters/five-words.md
  - Work in progress:
      - Overview: wip/index.md
      - Chapter layout specimen: wip/chapter-layout.md
extra_css:
  - stylesheets/chapters.css
markdown_extensions:
  - admonition
  - md_in_html
  - footnotes
  - toc:
      permalink: true
